<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azan & Iqamah — Phrase Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700&family=Barlow:wght@300;400;500&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:    #0D1B2A;
    --navy2:   #152234;
    --navy3:   #1E3050;
    --gold:    #C8983A;
    --gold2:   #E4B55A;
    --gold3:   #F5D080;
    --ivory:   #F2EDE3;
    --ivory2:  #E8E1D4;
    --muted:   #8A9BB5;
    --white:   #FFFFFF;
    --panel-w: 320px;
    --bottom-bar: 64px;
  }

  html, body {
    height: 100%;
    background: var(--navy);
    color: var(--ivory);
    font-family: 'Barlow', sans-serif;
    font-weight: 300;
    overflow: hidden;
  }

  /* ── Layout ─────────────────────────────── */
  #app {
    display: flex;
    height: 100vh;
    height: 100dvh;   /* dynamic viewport: excludes mobile URL bar */
    width: 100vw;
  }

  /* ══════════════════════════════════════════
     SIDEBAR — desktop
  ══════════════════════════════════════════ */
  #sidebar {
    width: var(--panel-w);
    flex-shrink: 0;
    background: var(--navy2);
    border-right: 1px solid rgba(200,152,58,0.18);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: transform 0.3s ease;
    z-index: 100;
  }

  #sidebar-header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid rgba(200,152,58,0.15);
  }

  #sidebar-header .eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
  }

  #sidebar-header h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--ivory);
    line-height: 1.1;
  }

  #sidebar-header h1 span { color: var(--gold2); }

  #sidebar-header p {
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
    line-height: 1.5;
  }

  /* close button — hidden on desktop */
  #sidebar-close {
    display: none;
    position: absolute;
    top: 16px; right: 16px;
    width: 32px; height: 32px;
    background: rgba(200,152,58,0.1);
    border: 1px solid rgba(200,152,58,0.25);
    border-radius: 50%;
    color: var(--gold);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    align-items: center;
    justify-content: center;
  }

  #phrase-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0;
    scrollbar-width: thin;
    scrollbar-color: var(--navy3) transparent;
  }

  #phrase-list::-webkit-scrollbar { width: 4px; }
  #phrase-list::-webkit-scrollbar-thumb { background: var(--navy3); border-radius: 2px; }

  .section-header {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    padding: 16px 24px 8px;
    border-top: 1px solid rgba(200,152,58,0.15);
    margin-top: 4px;
  }

  .section-header:first-child { border-top: none; margin-top: 0; }

  .phrase-item {
    padding: 12px 24px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background 0.2s, border-color 0.2s;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .phrase-item:hover { background: rgba(200,152,58,0.06); }

  .phrase-item.active {
    background: rgba(200,152,58,0.1);
    border-left-color: var(--gold);
  }

  .phrase-item .idx {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    color: var(--muted);
    min-width: 20px;
    margin-top: 2px;
  }

  .phrase-item.active .idx { color: var(--gold); }

  .phrase-text-block { flex: 1; min-width: 0; }

  .phrase-arabic-mini {
    font-family: 'Amiri', serif;
    font-size: 16px;
    color: var(--gold3);
    direction: rtl;
    text-align: right;
    line-height: 1.5;
    margin-bottom: 3px;
  }

  .phrase-item.active .phrase-arabic-mini { color: var(--gold2); }

  .phrase-translit-mini {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }

  /* ══════════════════════════════════════════
     MAIN PANEL
  ══════════════════════════════════════════ */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--navy);
    min-width: 0;
    position: relative;
  }

  /* ── Top bar ── */
  #top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 40px;
    border-bottom: 1px solid rgba(200,152,58,0.1);
    flex-shrink: 0;
    gap: 12px;
  }

  /* hamburger — hidden on desktop */
  #menu-btn {
    display: none;
    width: 36px; height: 36px;
    border-radius: 8px;
    border: 1px solid rgba(200,152,58,0.3);
    background: transparent;
    color: var(--gold);
    cursor: pointer;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .nav-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(200,152,58,0.3);
    background: transparent;
    color: var(--gold);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: background 0.2s, border-color 0.2s;
    flex-shrink: 0;
  }

  .nav-btn:hover { background: rgba(200,152,58,0.12); border-color: var(--gold); }
  .nav-btn:active { background: rgba(200,152,58,0.2); }
  .nav-btn:disabled { opacity: 0.25; cursor: default; }

  .progress-track {
    flex: 1;
    margin: 0 12px;
    height: 2px;
    background: rgba(200,152,58,0.12);
    border-radius: 1px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold) 0%, var(--gold3) 100%);
    border-radius: 1px;
    transition: width 0.4s ease;
  }

  .progress-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* ── Content area ── */
  #content {
    flex: 1;
    overflow: hidden;
    padding: 26px 48px 18px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* ── Hero phrase ── */
  #phrase-hero {
    text-align: center;
    height: 238px;              /* fixed: keeps the Word Breakdown row at the same height on every page */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-y: auto;           /* safety valve for extreme cases; content centers otherwise */
    margin-bottom: 10px;
    animation: fadeUp 0.5s ease;
    flex-shrink: 0;
    scrollbar-width: none;
  }

  #phrase-hero::-webkit-scrollbar { display: none; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Directional slide animations for swipe navigation */
  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(48px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(-48px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .slide-left #phrase-hero, .slide-left #word-grid {
    animation: slideInLeft 0.35s ease both;
  }

  .slide-right #phrase-hero, .slide-right #word-grid {
    animation: slideInRight 0.35s ease both;
  }

  .slide-left #word-grid, .slide-right #word-grid {
    animation-delay: 0.06s;
  }

  /* Swipe hint (mobile, shown once) */
  #swipe-hint {
    display: none;
    position: fixed;
    bottom: calc(var(--bottom-bar) + 16px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(21,34,52,0.95);
    border: 1px solid rgba(200,152,58,0.35);
    color: var(--gold3);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 8px 18px;
    border-radius: 24px;
    z-index: 60;
    pointer-events: none;
    animation: hintPulse 2.4s ease 1s 2 both;
    opacity: 0;
  }

  @keyframes hintPulse {
    0%   { opacity: 0; transform: translateX(-50%) translateY(6px); }
    20%  { opacity: 1; transform: translateX(-50%) translateY(0); }
    80%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ── Section change splash ── */
  #section-splash {
    position: fixed;
    inset: 0;
    background: rgba(13,27,42,0.92);
    backdrop-filter: blur(6px);
    z-index: 300;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.25s ease, visibility 0.25s ease;
  }

  #section-splash.show {
    opacity: 1;
    visibility: visible;
  }

  #section-splash svg {
    animation: spinRing 20s linear infinite;
    margin-bottom: 4px;
  }

  .splash-eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(200,152,58,0.6);
  }

  .splash-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(26px, 6vw, 40px);
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--gold2);
    text-align: center;
    padding: 0 20px;
  }

  #section-splash.show svg,
  #section-splash.show .splash-eyebrow,
  #section-splash.show .splash-title {
    animation: splashRise 0.4s ease both;
  }

  #section-splash.show svg { animation: splashRise 0.4s ease both, spinRing 20s linear infinite; }

  @keyframes splashRise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .arabesque-ring {
    width: 48px; height: 48px;
    margin: 0 auto 12px;
    flex-shrink: 0;
  }

  .arabesque-ring svg {
    width: 100%; height: 100%;
    animation: spinRing 20s linear infinite;
  }

  @keyframes spinRing {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .hero-arabic {
    font-family: 'Amiri', serif;
    font-size: clamp(22px, 3.4vw, 38px);
    color: var(--gold2);
    direction: rtl;
    line-height: 1.55;
    margin-bottom: 10px;
    letter-spacing: 0.02em;
  }

  .hero-translit {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(14px, 2vw, 17px);
    font-weight: 400;
    color: var(--ivory2);
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }

  .hero-english {
    font-size: clamp(12px, 1.6vw, 14px);
    color: var(--muted);
    max-width: 560px;
    margin: 0 auto;
    line-height: 1.6;
    font-style: italic;
  }

  /* ── Divider ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
    margin-top: 0;
    flex-shrink: 0;
  }

  .divider-line {
    flex: 1;
    height: 1px;
    background: rgba(200,152,58,0.18);
  }

  .divider-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
  }

  /* ── Word grid ── */
  #word-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 12px;
    align-content: start;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 4px;
    margin-bottom: 14px;
    scrollbar-width: thin;
    scrollbar-color: var(--navy3) transparent;
    animation: fadeUp 0.5s ease 0.1s both;
  }

  #word-grid::-webkit-scrollbar { width: 4px; }
  #word-grid::-webkit-scrollbar-thumb { background: var(--navy3); border-radius: 2px; }

  .word-card {
    background: var(--navy2);
    border: 1px solid rgba(200,152,58,0.12);
    border-radius: 10px;
    padding: 12px 16px 12px 32px;
    transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    cursor: default;
    position: relative;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 12px;
    min-height: 62px;
  }

  .word-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--gold) 0%, transparent 100%);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .word-card:hover { border-color: rgba(200,152,58,0.4); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,0,0,0.3); }
  .word-card:hover::before { opacity: 1; }

  .word-text-block {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .word-card .arabic {
    font-family: 'Amiri', serif;
    font-size: 24px;
    color: var(--gold3);
    direction: rtl;
    text-align: right;
    line-height: 1.4;
    white-space: nowrap;
  }

  .word-card .translit {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--ivory);
    letter-spacing: 0.04em;
  }

  .word-card .meaning {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
  }

  .word-card .word-num {
    position: absolute;
    top: 50%;
    left: 10px;
    transform: translateY(-50%);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    color: rgba(200,152,58,0.3);
    letter-spacing: 1px;
  }

  /* ── Section navigation — intentionally subtle, pinned to bottom ── */
  #section-nav {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 0;
    padding-top: 12px;
    border-top: 1px solid rgba(200,152,58,0.08);
    flex-shrink: 0;
  }

  .section-nav-btn {
    background: none;
    border: none;
    padding: 6px 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 2px;
    text-align: left;
    opacity: 0.55;
    transition: opacity 0.2s;
  }

  .section-nav-btn:last-child { text-align: right; align-items: flex-end; }

  .section-nav-btn:hover { opacity: 1; }

  .section-nav-btn:disabled {
    opacity: 0;
    pointer-events: none;
  }

  .snb-dir {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .snb-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }

  .section-nav-btn:hover .snb-title { color: var(--gold2); }

  /* Current section — decorative centerpiece, not clickable */
  #current-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    pointer-events: none;
    flex-shrink: 0;
  }

  .cs-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(200,152,58,0.45);
  }

  .cs-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--gold2);
    white-space: nowrap;
  }

  /* ── Slide arrows in the Word Breakdown divider — primary navigation ── */
  .side-arrow {
    flex-shrink: 0;
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(200,152,58,0.35);
    background: rgba(21,34,52,0.85);
    color: var(--gold2);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, border-color 0.2s, transform 0.2s;
  }

  .side-arrow:hover {
    background: rgba(200,152,58,0.18);
    border-color: var(--gold);
    transform: scale(1.08);
  }

  .side-arrow:disabled { opacity: 0.15; cursor: default; transform: none; }

  /* ── Footer bar ── */
  #footer-bar {
    padding: 12px 48px;
    border-top: 1px solid rgba(200,152,58,0.1);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    gap: 10px;
  }

  .footer-note {
    font-size: 11px;
    color: rgba(138,155,181,0.6);
    font-style: italic;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .tag-group { display: flex; gap: 8px; flex-shrink: 0; }

  .tag {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid rgba(200,152,58,0.25);
    color: var(--gold);
    white-space: nowrap;
  }

  /* ── Drawer overlay (mobile only) ── */
  #drawer-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 99;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.3s, visibility 0.3s;
  }

  /* ══════════════════════════════════════════
     MOBILE  ≤ 768px
  ══════════════════════════════════════════ */
  @media (max-width: 768px) {

    html, body { overflow: hidden; }

    #app { flex-direction: column; }

    /* Sidebar becomes a slide-in drawer */
    #sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: min(320px, 88vw);
      transform: translateX(-100%);
      z-index: 200;
      border-right: 1px solid rgba(200,152,58,0.3);
    }

    #sidebar.open { transform: translateX(0); }

    #sidebar-header {
      padding: 20px 20px 16px;
      position: relative;
    }

    #sidebar-close {
      display: flex;
    }

    #drawer-overlay { display: block; }
    #drawer-overlay.visible { opacity: 1; visibility: visible; pointer-events: all; }

    /* Main fills the app container (100dvh) minus bottom bar */
    #main {
      flex: 1;
      height: auto;
      min-height: 0;
      padding-bottom: var(--bottom-bar);
    }

    /* Top bar tighter */
    #top-bar {
      padding: 12px 16px;
      gap: 10px;
    }

    #menu-btn { display: flex; }

    .progress-track { margin: 0 8px; }

    /* Content padding tighter */
    #content {
      padding: 16px 16px 12px;
    }

    /* Hero — fixed height so the divider row never moves */
    #phrase-hero { height: 200px; margin-bottom: 8px; }

    .arabesque-ring {
      width: 36px; height: 36px;
      margin-bottom: 8px;
    }

    /* Word grid → compact single-column rows on phone */
    #word-grid {
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .word-card { padding: 10px 14px 10px 30px; min-height: 54px; gap: 10px; }
    .word-card .arabic { font-size: 21px; }
    .word-card .translit { font-size: 13px; }
    .word-card .meaning { font-size: 11px; }

    #section-nav { margin-top: 0; padding-top: 10px; gap: 10px; }
    .section-nav-btn { opacity: 0.8; }
    .cs-name { font-size: 13px; }
    .cs-label { font-size: 8px; }
    .section-nav-btn { padding: 6px 2px; }
    .snb-title { font-size: 12px; }

    /* Divider arrows: smaller on phone, still visible alongside bottom bar + swipe */
    .side-arrow { width: 36px; height: 36px; font-size: 16px; }
    .divider { gap: 10px; }

    /* Bottom bar slide arrows get primary visual weight */
    #bottom-bar .nav-btn {
      background: rgba(200,152,58,0.15);
      border-color: rgba(200,152,58,0.5);
    }
    #bottom-bar .nav-btn:disabled {
      background: transparent;
      border-color: rgba(200,152,58,0.3);
    }

    /* Footer: just the note, no tags */
    #footer-bar {
      padding: 10px 18px;
    }

    .tag-group { display: none; }

    .footer-note { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Bottom nav bar */
    #bottom-bar {
      display: flex !important;
    }

    #swipe-hint { display: block; }
  }

  @media (max-width: 400px) {
    #word-grid { grid-template-columns: 1fr; gap: 8px; }
    .word-card .arabic { font-size: 19px; }
    .hero-arabic { font-size: 22px; }
  }

  /* ── Bottom bar (mobile nav) ── */
  #bottom-bar {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: var(--bottom-bar);
    background: var(--navy2);
    border-top: 1px solid rgba(200,152,58,0.2);
    z-index: 50;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    gap: 12px;
  }

  #bottom-bar .nav-btn {

      { ar: "وَآلِ", tr: "wa ali", en: "and the family of" },
      { ar: "مُحَمَّدٍ", tr: "Muhammad", en: "Muhammad" },
    ]
  },
];

const salamPhrases = [
  {
    arabic: "السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللّٰهِ وَبَرَكَاتُهُ",
    translit: "As-salamu 'alayka ayyuhan Nabiyyu wa rahmatullahi wa barakatuh",
    english: "Peace be upon you, O Prophet, and the mercy of Allah and His blessings.",
    note: "First salam — to the Prophet ﷺ.",
    words: [
      { ar: "السَّلَامُ", tr: "as-salamu", en: "peace" },
      { ar: "عَلَيْكَ", tr: "'alayka", en: "be upon you" },
      { ar: "أَيُّهَا", tr: "ayyuha", en: "O" },
      { ar: "النَّبِيُّ", tr: "an-Nabiyyu", en: "the Prophet" },
      { ar: "وَرَحْمَةُ", tr: "wa rahmatu", en: "and the mercy" },
      { ar: "اللّٰهِ", tr: "Allah", en: "of Allah" },
      { ar: "وَبَرَكَاتُهُ", tr: "wa barakatuh", en: "and His blessings" },
    ]
  },
  {
    arabic: "السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللّٰهِ الصَّالِحِينَ",
    translit: "As-salamu 'alayna wa 'ala 'ibadillahis salihin",
    english: "Peace be upon us and upon the righteous servants of Allah.",
    note: "Second salam — us & the righteous.",
    words: [
      { ar: "السَّلَامُ", tr: "as-salamu", en: "peace" },
      { ar: "عَلَيْنَا", tr: "'alayna", en: "be upon us" },
      { ar: "وَعَلَى", tr: "wa 'ala", en: "and upon" },
      { ar: "عِبَادِ", tr: "'ibadi", en: "the servants" },
      { ar: "اللّٰهِ", tr: "Allah", en: "of Allah" },
      { ar: "الصَّالِحِينَ", tr: "as-salihin", en: "the righteous" },
    ]
  },
  {
    arabic: "السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللّٰهِ وَبَرَكَاتُهُ",
    translit: "As-salamu 'alaykum wa rahmatullahi wa barakatuh",
    english: "Peace be upon you, and the mercy of Allah and His blessings.",
    note: "Final salam — peace upon all.",
    words: [
      { ar: "السَّلَامُ", tr: "as-salamu", en: "peace" },
      { ar: "عَلَيْكُمْ", tr: "'alaykum", en: "be upon you (all)" },
      { ar: "وَرَحْمَةُ", tr: "wa rahmatu", en: "and the mercy" },
      { ar: "اللّٰهِ", tr: "Allah", en: "of Allah" },
      { ar: "وَبَرَكَاتُهُ", tr: "wa barakatuh", en: "and His blessings" },
    ]
  },
];

// ── Five top-level categories ──
// Per-item tags preserve source references inside merged sections
const tagAll = (arr, tag) => arr.map(p => ({ ...p, tag }));

const sections = [
  { key: 'azan', title: 'Azan & Iqamah', tag: 'Twelver Shia',
    items: phrases },

  { key: 'duas', title: 'Dua of Namaz', tag: 'Dua',
    items: [
      ...tagAll(duaPhrases, 'Dua After Azan'),
      ...tagAll(ibrahimPhrases, 'Quran 14:40–41'),
      ...tagAll(israPhrases, 'Quran 17:80'),
    ] },

  { key: 'surahs', title: 'Namaz Surah', tag: 'Quran',
    items: [
      ...tagAll(hamdPhrases, 'Quran 1:1–7'),
      ...tagAll(ikhlasPhrases, 'Quran 112:1–4'),
    ] },

  { key: 'recitations', title: 'Namaz Recitations', tag: 'Recitation',
    items: [
      ...tagAll(namazPhrases, 'Ruku & Sujood'),
      ...tagAll(tasbihPhrases, 'Tasbihat Arba\'a'),
    ] },

  { key: 'closing', title: 'Tashahhud & Salam', tag: 'Closing',
    items: [
      ...tagAll(tashahhudPhrases, 'Tashahhud'),
      ...tagAll(salamPhrases, 'Salam'),
    ] },
];

// Unified flat list: { sectionIdx, tag, phrase, localIdx }
const allItems = sections.flatMap((s, si) =>
  s.items.map((p, i) => ({ sectionIdx: si, tag: p.tag || s.tag, phrase: p, localIdx: i }))
);

// First global index of each section (for section jumping)
const sectionStarts = [];
{
  let acc = 0;
  sections.forEach(s => { sectionStarts.push(acc); acc += s.items.length; });
}

let current = 0;

function buildSidebar() {
  const list = document.getElementById('phrase-list');
  let globalIdx = 0;

  sections.forEach(s => {
    const header = document.createElement('div');
    header.className = 'section-header';
    header.textContent = s.title;
    list.appendChild(header);

    s.items.forEach((p, i) => {
      list.appendChild(makeItem(p, globalIdx, i));
      globalIdx++;
    });
  });
}

function makeItem(p, globalIdx, localIdx) {
  const item = document.createElement('div');
  item.className = 'phrase-item' + (globalIdx === 0 ? ' active' : '');
  item.dataset.idx = globalIdx;
  item.innerHTML = `
    <span class="idx">${String(localIdx + 1).padStart(2, '0')}</span>
    <div class="phrase-text-block">
      <div class="phrase-arabic-mini">${p.arabic}</div>
      <div class="phrase-translit-mini">${p.translit}</div>
    </div>
  `;
  item.addEventListener('click', () => selectPhrase(globalIdx));
  return item;
}

function selectPhrase(idx) {
  current = idx;

  document.querySelectorAll('.phrase-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.idx) === idx);
  });

  const activeItem = document.querySelector('.phrase-item.active');
  if (activeItem) activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

  const p = allItems[idx].phrase;

  document.getElementById('hero-arabic').textContent = p.arabic;
  document.getElementById('hero-translit').textContent = p.translit;
  document.getElementById('hero-english').textContent = p.english;
  document.getElementById('footer-note').textContent = p.note;

  // Restart animation
  const hero = document.getElementById('phrase-hero');
  hero.style.animation = 'none';
  hero.offsetHeight; // reflow
  hero.style.animation = '';

  // Word grid
  const grid = document.getElementById('word-grid');
  grid.style.animation = 'none';
  grid.offsetHeight;
  grid.style.animation = '';
  grid.innerHTML = '';

  p.words.forEach((w, i) => {
    const card = document.createElement('div');
    card.className = 'word-card';
    card.style.animationDelay = `${i * 0.05}s`;
    card.innerHTML = `
      <span class="word-num">${String(i + 1).padStart(2, '0')}</span>
      <div class="word-text-block">
        <div class="translit">${w.tr}</div>
        <div class="meaning">${w.en}</div>
      </div>
      <div class="arabic">${w.ar}</div>
    `;
    grid.appendChild(card);
  });

  // Section tag
  const tags = document.querySelector('.tag-group');
  tags.innerHTML = `<span class="tag">${allItems[idx].tag}</span><span class="tag">Arabic</span>`;

  // Section navigation buttons
  const si = allItems[idx].sectionIdx;
  document.getElementById('current-section-name').textContent = sections[si].title;

  // Splash on section change (not on initial load)
  if (typeof selectPhrase.lastSection === 'number' && selectPhrase.lastSection !== si) {
    const splash = document.getElementById('section-splash');
    document.getElementById('splash-title').textContent = sections[si].title;
    splash.classList.add('show');
    clearTimeout(selectPhrase.splashTimer);
    selectPhrase.splashTimer = setTimeout(() => splash.classList.remove('show'), 620);
  }
  selectPhrase.lastSection = si;

  const btnLast = document.getElementById('btn-last-section');
  const btnNext2 = document.getElementById('btn-next-section');

  if (si > 0) {
    btnLast.disabled = false;
    document.getElementById('last-section-title').textContent = sections[si - 1].title;
  } else {
    btnLast.disabled = true;
  }

  if (si < sections.length - 1) {
    btnNext2.disabled = false;
    document.getElementById('next-section-title').textContent = sections[si + 1].title;
  } else {
    btnNext2.disabled = true;
  }

  // Progress — update both desktop and mobile bars
  const pct = ((idx + 1) / allItems.length) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${idx + 1} / ${allItems.length}`;
  document.getElementById('progress-fill-m').style.width = pct + '%';
  document.getElementById('progress-label-m').textContent = `${idx + 1} / ${allItems.length}`;

  // Nav buttons — desktop
  document.getElementById('btn-prev-side').disabled = idx === 0;
  document.getElementById('btn-next-side').disabled = idx === allItems.length - 1;
  // Nav buttons — mobile
  document.getElementById('btn-prev-m').disabled = idx === 0;
  document.getElementById('btn-next-m').disabled = idx === allItems.length - 1;

  // Scroll content to top
  document.getElementById('word-grid').scrollTop = 0;
}

// ── Drawer helpers ────────────────────────────
function openDrawer() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('visible');
  document.body.style.overflow = 'hidden';
}

function closeDrawer() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('visible');
  document.body.style.overflow = '';
}

// ── Event wiring ──────────────────────────────
// Desktop nav
document.getElementById('btn-prev-side').addEventListener('click', () => goPrev());
document.getElementById('btn-next-side').addEventListener('click', () => goNext());

// Mobile bottom bar nav
document.getElementById('btn-prev-m').addEventListener('click', () => goPrev());
document.getElementById('btn-next-m').addEventListener('click', () => goNext());

// Mobile menu open
document.getElementById('menu-btn').addEventListener('click', openDrawer);
document.getElementById('list-btn').addEventListener('click', openDrawer);

// Section navigation
document.getElementById('btn-last-section').addEventListener('click', () => {
  const si = allItems[current].sectionIdx;
  if (si > 0) { swipeDir = 'right'; selectPhrase(sectionStarts[si - 1]); }
});
document.getElementById('btn-next-section').addEventListener('click', () => {
  const si = allItems[current].sectionIdx;
  if (si < sections.length - 1) { swipeDir = 'left'; selectPhrase(sectionStarts[si + 1]); }
});

// Close drawer
document.getElementById('sidebar-close').addEventListener('click', closeDrawer);
document.getElementById('drawer-overlay').addEventListener('click', closeDrawer);

// Close drawer when a phrase is tapped on mobile
document.getElementById('phrase-list').addEventListener('click', () => {
  if (window.innerWidth <= 768) closeDrawer();
});

// Keyboard nav
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    if (current > 0) selectPhrase(current - 1);
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (current < allItems.length - 1) selectPhrase(current + 1);
  } else if (e.key === 'Escape') {
    closeDrawer();
  }
});

// ── Swipe gestures (mobile) ──────────────────
let swipeDir = null; // 'left' | 'right' | null

const origSelectPhrase = selectPhrase;
selectPhrase = function(idx) {
  // Apply directional slide class before content updates
  const content = document.getElementById('content');
  content.classList.remove('slide-left', 'slide-right');
  if (swipeDir === 'left') {
    void content.offsetWidth;
    content.classList.add('slide-left');
  } else if (swipeDir === 'right') {
    void content.offsetWidth;
    content.classList.add('slide-right');
  }
  swipeDir = null;
  origSelectPhrase(idx);
};

function goNext() {
  if (current < allItems.length - 1) { swipeDir = 'left'; selectPhrase(current + 1); }
}
function goPrev() {
  if (current > 0) { swipeDir = 'right'; selectPhrase(current - 1); }
}

let touchStartX = 0, touchStartY = 0, touchStartTime = 0, edgeSwipe = false;

const contentEl = document.getElementById('content');

contentEl.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchStartTime = Date.now();
  edgeSwipe = touchStartX < 24; // left edge → drawer gesture
}, { passive: true });

contentEl.addEventListener('touchmove', e => {
  // Live drag feedback — nudge the hero slightly with the finger
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 12 && !edgeSwipe) {
    const hero = document.getElementById('phrase-hero');
    const damped = Math.max(-40, Math.min(40, dx * 0.25));
    hero.style.transform = `translateX(${damped}px)`;
    hero.style.transition = 'none';
  }
}, { passive: true });

contentEl.addEventListener('touchend', e => {
  const hero = document.getElementById('phrase-hero');
  hero.style.transform = '';
  hero.style.transition = 'transform 0.25s ease';

  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const dt = Date.now() - touchStartTime;

  // Must be predominantly horizontal
  if (Math.abs(dx) < Math.abs(dy) * 1.2) return;

  // Edge swipe from left edge opens the drawer
  if (edgeSwipe && dx > 60) { openDrawer(); return; }

  // Fast flick needs less distance; slow drag needs more
  const threshold = dt < 250 ? 40 : 70;

  if (dx <= -threshold) goNext();
  else if (dx >= threshold) goPrev();
}, { passive: true });

// Swipe right on the open drawer edge to close it
document.getElementById('sidebar').addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
}, { passive: true });
document.getElementById('sidebar').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (dx < -60) closeDrawer();
}, { passive: true });

buildSidebar();
selectPhrase(0);
</script>
